name: Exporo
description: 'Exporo is a Hamburg, Germany-based digital investment platform for real
  estate and renewable-energy infrastructure, operating as a regulated European Crowdfunding
  Service Provider (ECSP). The platform lets private investors participate in residential
  and commercial property development as well as clean-energy projects such as solar,
  with typical terms of 12-36 months. Exporo has mediated over EUR 1.17 billion of
  capital across more than 600 financed projects, and also offers Club Deals for larger
  qualified investors. It was surfaced as a portfolio company of Partech and added
  to the API Evangelist network. No public developer API or developer portal is currently
  published; this profile is maintained as a company lead and will be enriched if a
  developer surface appears.'
